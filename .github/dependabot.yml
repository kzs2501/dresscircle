# Weekly dependency updates, grouped so routine bumps arrive as one pull request.
# Major versions still come one by one: they're the ones that need reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # Playwright comes on its own: a new version brings new browser builds, so the
        # visual baselines are shot again in its Docker image, at the same version.
        exclude-patterns: ["@playwright/test", "playwright", "playwright-core"]
    ignore:
      # The types describe the runtime, and the runtime moves on purpose (.nvmrc, engines),
      # not whenever Node ships a new major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # React Query after 5.105.0 changed how a fetch already in flight is reused (5.106,
      # then backported to 5.105.3). With it, an organiser's refund sometimes stays "Refund
      # pending" after the provider confirms it: 4 failures in 61 runs of that end-to-end
      # test on 5.106.1 and 1 in 60 on 5.105.3, against none in 75 on 5.105.0. CI retries a
      # failed browser test once, which hides a failure that rare. It stays at 5.105.0
      # until the cause is found; a candidate runs that test 30 times, one at a time.
      - dependency-name: "@tanstack/react-query"
        versions: [">=5.105.1"]
  - package-ecosystem: github-actions
    # The workflows, and the composite actions they share.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
