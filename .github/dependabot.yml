# Weekly dependency updates, grouped so routine bumps arrive as one pull request.
# Major versions still come one by one: they're the ones that need reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # Playwright comes on its own: a new version brings new browser builds, so the
        # visual baselines are shot again in its Docker image, at the same version.
        exclude-patterns: ["@playwright/test", "playwright", "playwright-core"]
    ignore:
      # The types describe the runtime, and the runtime moves on purpose (.nvmrc, engines),
      # not whenever Node ships a new major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # React Query 5.106 changed how a fetch already in flight is reused. With it, an
      # organiser's refund sometimes stays "Refund pending" after the provider confirms it:
      # 4 failures in 61 runs of that end-to-end test, against none in 55 on 5.105. CI
      # retries a failed browser test once, which hides a failure that rare, so a newer
      # version is tried by running that test 30 times, one at a time, before it's taken.
      - dependency-name: "@tanstack/react-query"
        versions: ["5.106.x", "5.107.x"]
  - package-ecosystem: github-actions
    # The workflows, and the composite actions they share.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
